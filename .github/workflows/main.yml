name: Continuous Integration and Delivery

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-and-evaluate:
    runs-on: ubuntu-latest
    
    env:
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      CREDIT_SCORING_URL: ${{ secrets.CREDIT_SCORING_URL }} 

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: "pip"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install flake8 pytest

    - name: Run Flake8 Linting
      run: |
        flake8 src evals tests --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 src evals tests --count --exit-zero --max-complexity=15 --max-line-length=127 --statistics

    - name: Run Unit Tests
      run: |
        pytest tests/ -v

    - name: Run Agent Trajectory Evals
      run: |
        pytest evals/ -v

  build-and-push:
    name: Continuous Delivery
    needs: test-and-evaluate
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      
      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.AGENT_ECR_REPOSITORY_NAME }}
          IMAGE_TAG: latest
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG